<style>
  @import url("https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap");
  .af-system,
  .af-system * {
    box-sizing: border-box;
  }
  .af-system {
    --af-dark: #192a30;
    --af-blue: #087fa3;
    --af-signal: #f0c64b;
    display: grid;
    width: min(1240px, 100%);
    min-height: 470px;
    grid-template-columns: 43% 57%;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 5px;
    background: var(--af-dark);
    color: #fff;
    font:
      400 15px/1.5 Manrope,
      Arial,
      sans-serif;
  }
  .af-system-copy {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 64px 56px;
  }
  .af-system-eyebrow {
    margin: 0 0 20px;
    color: var(--af-signal);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .af-system h2 {
    margin: 0 0 20px;
    font-size: 40px;
    line-height: 1.1;
    font-weight: 600;
  }
  .af-system-copy > p {
    margin: 0;
    color: #c2ccce;
    font-size: 14px;
    line-height: 1.8;
  }
  .af-system-link {
    margin-top: 25px;
    color: var(--af-signal);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
  }
  .af-system-image {
    min-height: 470px;
    background: #26383d;
  }
  .af-system-image img {
    display: block;
    width: 100%;
    height: 100%;
    min-height: inherit;
    object-fit: cover;
    filter: saturate(0.72);
  }
  @media (max-width: 850px) {
    .af-system {
      grid-template-columns: 1fr;
    }
    .af-system-image {
      min-height: 360px;
    }
  }
  @media (max-width: 560px) {
    .af-system-copy {
      padding: 38px 26px;
    }
    .af-system h2 {
      font-size: 32px;
    }
    .af-system-image {
      min-height: 260px;
    }
  }
</style>
<section class="af-system">
  <div class="af-system-copy">
    <div class="af-system-eyebrow">Dukungan kebutuhan</div>
    <h2>Komponen yang sesuai untuk setiap tahap proses.</h2>
    <p>
      Kebutuhan setiap instalasi berbeda. Kami menyediakan komponen yang dapat
      digunakan pada berbagai tahap pengolahan air dan proses filtrasi.
    </p>
    <a class="af-system-link" href="#af-process">Lihat cara kerja →</a>
  </div>
  <div class="af-system-image">
    <img
      src="https://images.unsplash.com/photo-1516937941344-00b4e0337589?auto=format&amp;fit=crop&amp;w=1400&amp;q=85"
      alt="Fasilitas pemrosesan industri"
      loading="lazy"
    />
  </div>
</section>
