<style>
  @import url("https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap");
  .af-nav,
  .af-nav * {
    box-sizing: border-box;
  }
  .af-nav {
    --af-bg: #f1f3f2;
    --af-line: #d5dddf;
    --af-blue: #087fa3;
    --af-dark: #192a30;
    --af-muted: #5c6b70;
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100%;
    min-height: 78px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--af-line);
    background: rgba(241, 243, 242, 0.96);
    color: #17252a;
    font:
      400 15px/1.5 Manrope,
      Arial,
      sans-serif;
  }
  .af-nav a {
    color: inherit;
    text-decoration: none;
  }
  .af-nav-inner {
    width: min(1240px, calc(100% - 64px));
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .af-brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
  }
  .af-brand-mark {
    position: relative;
    flex: 0 0 30px;
    width: 30px;
    height: 30px;
    border-radius: 4px;
    background: var(--af-blue);
  }
  .af-brand-mark::after {
    position: absolute;
    top: 12px;
    left: 9px;
    width: 11px;
    height: 5px;
    border: 1px solid #fff;
    border-top: 0;
    border-radius: 0 0 8px 8px;
    content: "";
    transform: rotate(-10deg);
  }
  .af-nav-links {
    display: flex;
    gap: 32px;
    color: var(--af-muted);
    font-size: 12px;
  }
  .af-nav-links a:hover {
    color: #17252a;
  }
  .af-nav-action {
    padding: 12px 17px;
    border: 1px solid var(--af-dark);
    border-radius: 3px;
    background: var(--af-dark);
    color: #fff !important;
    font-size: 11px;
    font-weight: 600;
    transition: background 160ms ease;
  }
  .af-nav-action:hover {
    border-color: var(--af-blue);
    background: var(--af-blue);
  }
  @media (max-width: 850px) {
    .af-nav-links {
      display: none;
    }
  }
  @media (max-width: 560px) {
    .af-nav {
      min-height: 68px;
    }
    .af-nav-inner {
      width: calc(100% - 36px);
    }
    .af-brand {
      font-size: 12px;
    }
    .af-brand-mark {
      flex-basis: 27px;
      width: 27px;
      height: 27px;
    }
    .af-brand-mark::after {
      top: 11px;
      left: 7px;
    }
    .af-nav-action {
      display: none;
    }
  }
</style>
<header class="af-nav">
  <div class="af-nav-inner">
    <a class="af-brand" href="#af-home"
      ><span class="af-brand-mark" aria-hidden="true"></span>ARTHAWA FILTER</a
    >
    <nav class="af-nav-links" aria-label="Navigasi utama">
      <a href="#af-home">Beranda</a><a href="#af-about">Tentang</a
      ><a href="#af-products">Produk</a><a href="#af-process">Proses</a
      ><a href="#af-contact">Kontak</a>
    </nav>
    <a class="af-nav-action" href="#af-contact">Request quotation</a>
  </div>
</header>
