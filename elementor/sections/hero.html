<style>
  @import url("https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap");
  .af-hero,
  .af-hero * {
    box-sizing: border-box;
  }
  .af-hero {
    --af-bg: #ffffff;
    --af-blue: #087fa3;
    --af-muted: #5c6b70;
    --af-line: #d5dddf;
    --af-dark: #192a30;
    --af-signal: #f0c64b;
    position: relative;
    isolation: isolate;
    width: min(1240px, 100%);
    min-height: 600px;
    margin: 0 auto;
    padding: 40px 32px 68px;
    overflow: hidden;
    background-color: white;
    background-image:
      linear-gradient(rgba(8, 127, 163, 0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(8, 127, 163, 0.055) 1px, transparent 1px);
    background-size: 36px 36px;
    color: #17252a;
    font:
      400 15px/1.5 Manrope,
      Arial,
      sans-serif;
  }
  .af-hero::before {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 1) 0%,
      rgba(255, 255, 255, 0.99) 34%,
      rgba(255, 255, 255, 0.92) 46%,
      rgba(255, 255, 255, 0.65) 58%,
      rgba(255, 255, 255, 0) 76%
    );
    content: "";
    pointer-events: none;
  }
  .af-hero-copy {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: min(55%, 620px);
    min-height: 492px;
    padding: 24px 0;
  }
  .af-hero-eyebrow {
    margin: 0 0 20px;
    color: var(--af-blue);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .af-hero h1 {
    max-width: 620px;
    margin: 0 0 24px;
    font-size: 60px;
    line-height: 1.04;
    font-weight: 600;
  }
  .af-hero h1 span {
    color: var(--af-blue);
  }
  .af-hero-copy > p {
    max-width: 500px;
    margin: 0;
    color: var(--af-muted);
    font-size: 16px;
    line-height: 1.75;
  }
  .af-hero-buttons {
    display: flex;
    gap: 12px;
    margin-top: 32px;
  }
  .af-hero-buttons a {
    display: inline-flex;
    min-height: 48px;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    border: 1px solid transparent;
    border-radius: 3px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    transition:
      background 160ms ease,
      border-color 160ms ease,
      color 160ms ease;
  }
  .af-hero-primary {
    background: var(--af-dark);
    color: #fff;
  }
  .af-hero-primary:hover {
    background: var(--af-blue);
    color: #fff;
  }
  .af-hero-secondary {
    border-color: var(--af-line) !important;
    background: #fff;
    color: #17252a;
  }
  .af-hero-secondary:hover {
    border-color: var(--af-dark) !important;
  }
  .af-hero-points {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    margin-top: 34px;
    color: var(--af-muted);
    font-size: 11px;
    font-weight: 600;
  }
  .af-hero-points span::before {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin: 0 8px 1px 0;
    background: var(--af-signal);
    content: "";
  }
  .af-hero-3d {
    position: absolute;
    inset: 0 auto 0 20%;
    z-index: 0;
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
  }
  @media (max-width: 850px) {
    .af-hero {
      display: grid;
      grid-template-columns: 1fr;
      min-height: auto;
      padding: 42px 32px 64px;
    }
    .af-hero::before {
      background: linear-gradient(
        180deg,
        var(--af-bg) 0%,
        rgba(255, 255, 255, 0.97) 48%,
        rgba(255, 255, 255, 0.7) 58%,
        rgba(255, 255, 255, 0) 72%
      );
    }
    .af-hero-copy {
      width: 100%;
      max-width: 700px;
      min-height: 0;
      padding: 16px 0 0;
    }
    .af-hero h1 {
      max-width: 700px;
      font-size: 54px;
    }
    .af-hero-3d {
      position: relative;
      inset: auto;
      width: min(100%, 540px);
      height: 380px;
      margin: 16px auto 0;
    }
  }
  @media (max-width: 560px) {
    .af-hero {
      padding: 32px 18px 48px;
    }
    .af-hero h1 {
      font-size: 42px;
    }
    .af-hero-copy > p {
      font-size: 15px;
    }
    .af-hero-points {
      display: grid;
      gap: 10px;
      margin-top: 26px;
    }
    .af-hero-3d {
      height: 300px;
    }
    .af-hero-buttons {
      flex-wrap: wrap;
    }
    .af-hero-buttons a {
      flex: 1 1 auto;
    }
  }
</style>
<section class="af-hero" id="af-home">
  <div class="af-hero-copy">
    <div class="af-hero-eyebrow">Water treatment · Industrial supply</div>
    <h1>Komponen filtrasi untuk <span>kebutuhan industri.</span></h1>
    <p>
      Filter cartridge, membrane, housing, valve dan komponen water treatment
      untuk kebutuhan operasional maupun project.
    </p>
    <div class="af-hero-buttons">
      <a class="af-hero-primary" href="#af-products">Lihat produk</a
      ><a class="af-hero-secondary" href="#af-contact">Hubungi kami</a>
    </div>
    <div class="af-hero-points" aria-label="Kategori layanan">
      <span>Filtrasi industri</span><span>Membrane &amp; housing</span
      ><span>Kebutuhan project</span>
    </div>
  </div>
  <iframe
    class="af-hero-3d"
    src="https://indoarthawafilter.vercel.app/produk-3d.html?embed=1"
    title="Model 3D instalasi pengolahan air Arthawa Filter"
    loading="lazy"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
</section>
